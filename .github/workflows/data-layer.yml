name: Data layer

# seedelf-data/, on every PR that touches it (chunk 26c). Its live tests,
# which need home's services, stay #[ignore]d and don't run here.
on:
  pull_request:
    paths:
      - "seedelf-data/**"
      - ".github/workflows/data-layer.yml"
      # Every file beside it that its build reads (include_str!). What the token pools' checks read (web wallet
      # chunk 34's 34c): the wallet's token list, built in, and the vectors, the node's box spellings (chunk 51,
      # r3a#1's class) and the scenarios its copy of the rules is held to.
      - "seedelf-platform/seedelf-web-wallet/extension/src/tokens/list.json"
      - "seedelf-platform/seedelf-core/tests/fixtures/lovejoin-pool-vectors.json"
      - "seedelf-platform/seedelf-core/tests/fixtures/lovejoin-box-spellings.json"
      - "seedelf-platform/seedelf-web-wallet/extension/tests/fixtures/lovejoin-shown.json"
      # What its constants are held to (api/src/constants.rs): the contract hash and the policy in seedelf-core's,
      # and Lovejoin's mainnet mix box in the wallet's (1.6.0's release review, x-release#8).
      - "seedelf-platform/seedelf-core/src/constants.rs"
      - "seedelf-platform/seedelf-web-wallet/extension/src/networks.ts"
      # A live test's fixture (api/tests/live_public.rs): the test doesn't run here, but it's compiled, so a move or
      # a rename breaks the build.
      - "seedelf-platform/seedelf-web-wallet/extension/tests/fixtures/nft-images.json"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: seedelf-data
    steps:
      # No token left in .git: the build runs every dependency's build script.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The toolchain seedelf-data/rust-toolchain.toml pins: keep the two in
      # step, as data-layer-deploy.yml does.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (v2.9.3)
        with:
          workspaces: seedelf-data

      - name: Format
        run: cargo fmt --all -- --check

      # --locked: the crates Cargo.lock records, the graph a deploy builds.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

      # The script the deploy key runs as root on the VPS.
      - name: The deploy script
        run: shellcheck -s sh deploy/edge/seedelf-data-deploy
