name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: aiken-lang/setup-aiken@1728a4be43be099752e22d8b841706caaa6fdd88 # v1 (v1.0.4)
        with:
          version: v1.1.24
      - run: aiken fmt --check
        working-directory: seedelf-contracts
      - run: aiken check -D
        working-directory: seedelf-contracts
      - run: aiken build
        working-directory: seedelf-contracts