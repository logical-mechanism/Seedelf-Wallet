name: Release

on:
  push:
    tags:
      - "*.*.*"

# The CLI's release (RELEASE.md): three builds, then one job that signs what
# they made and publishes it. A build runs every crate's build script and proc
# macro, and the toolchain action, and a process they start outlives its step.
# So the builds get a read-only token, leave none in .git, and never see the
# release key; the key and the write token are the signing job's alone, which
# builds nothing (chunk 51, b1#3).
permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The toolchain seedelf-platform/rust-toolchain.toml pins, which every
      # cargo call in that folder runs on: keep the two in step.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: 1.98.1

      - name: Build (Linux)
        working-directory: seedelf-platform
        run: cargo build --release --locked --bin seedelf-cli

      - name: Move Binary (Linux)
        working-directory: seedelf-platform
        run: mv target/release/seedelf-cli seedelf-cli.bin

      - name: Generate Binary Checksum (Linux)
        working-directory: seedelf-platform
        run: sha256sum seedelf-cli.bin > seedelf-cli.bin.sha256

      - name: Compress Binary and Checksum (Linux)
        working-directory: seedelf-platform
        run: tar -czvf seedelf-cli-linux.tar.gz seedelf-cli.bin

      - name: Generate Compressed File Checksum (Linux)
        working-directory: seedelf-platform
        run: sha256sum seedelf-cli-linux.tar.gz > seedelf-cli-linux.tar.gz.sha256

      - name: Create Unique Hashes File (Linux)
        working-directory: seedelf-platform
        run: |
          echo "Linux Binary: $(cat seedelf-cli.bin.sha256)" >> ../hashes-linux.txt
          echo "Linux Compressed File: $(cat seedelf-cli-linux.tar.gz.sha256)" >> ../hashes-linux.txt

      # Unsigned: sign-and-publish signs it.
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: seedelf-cli-linux
          path: |
            seedelf-platform/seedelf-cli-linux.tar.gz
            hashes-linux.txt

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The toolchain seedelf-platform/rust-toolchain.toml pins, which every
      # cargo call in that folder runs on: keep the two in step.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-gnu

      - name: Build (Windows)
        working-directory: seedelf-platform
        run: cargo build --release --locked --bin seedelf-cli --target x86_64-pc-windows-gnu

      - name: Move Binary (Windows)
        shell: pwsh
        working-directory: seedelf-platform
        run: mv target\x86_64-pc-windows-gnu\release\seedelf-cli.exe seedelf-cli.exe

      - name: Generate Binary Checksum (Windows)
        shell: pwsh
        working-directory: seedelf-platform
        run: |
          $hash = Get-FileHash seedelf-cli.exe -Algorithm SHA256
          $hash.Hash | Out-File -Encoding ASCII seedelf-cli.sha256

      - name: Compress Binary and Checksum (Windows)
        shell: pwsh
        working-directory: seedelf-platform
        run: Compress-Archive -Path seedelf-cli.exe -DestinationPath seedelf-cli-windows.zip

      - name: Generate Compressed File Checksum (Windows)
        shell: pwsh
        working-directory: seedelf-platform
        run: |
          $hash = Get-FileHash seedelf-cli-windows.zip -Algorithm SHA256
          $hash.Hash | Out-File -Encoding ASCII seedelf-cli-windows.zip.sha256

      - name: Create Unique Hashes File (Windows)
        shell: pwsh
        working-directory: seedelf-platform
        run: |
          echo "Windows Binary: $(Get-Content seedelf-cli.sha256)" >> ..\hashes-windows.txt
          echo "Windows Compressed File: $(Get-Content seedelf-cli-windows.zip.sha256)" >> ..\hashes-windows.txt

      # Unsigned: sign-and-publish signs it.
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: seedelf-cli-windows
          path: |
            seedelf-platform/seedelf-cli-windows.zip
            hashes-windows.txt

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The toolchain seedelf-platform/rust-toolchain.toml pins, which every
      # cargo call in that folder runs on: keep the two in step.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: 1.98.1
          targets: x86_64-apple-darwin

      - name: Build (macOS)
        working-directory: seedelf-platform
        run: cargo build --release --locked --bin seedelf-cli --target x86_64-apple-darwin

      - name: Move Binary (macOS)
        working-directory: seedelf-platform
        run: mv target/x86_64-apple-darwin/release/seedelf-cli seedelf-cli.bin

      - name: Generate Binary Checksum (macOS)
        working-directory: seedelf-platform
        run: shasum -a 256 seedelf-cli.bin > seedelf-cli.bin.sha256

      - name: Compress Binary and Checksum (macOS)
        working-directory: seedelf-platform
        run: tar -czvf seedelf-cli-macos.tar.gz seedelf-cli.bin

      - name: Generate Compressed File Checksum (macOS)
        working-directory: seedelf-platform
        run: shasum -a 256 seedelf-cli-macos.tar.gz > seedelf-cli-macos.tar.gz.sha256

      - name: Create Unique Hashes File (macOS)
        working-directory: seedelf-platform
        run: |
          echo "macOS Binary: $(cat seedelf-cli.bin.sha256)" >> ../hashes-macos.txt
          echo "macOS Compressed File: $(cat seedelf-cli-macos.tar.gz.sha256)" >> ../hashes-macos.txt

      # Unsigned: sign-and-publish signs it.
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: seedelf-cli-macos
          path: |
            seedelf-platform/seedelf-cli-macos.tar.gz
            hashes-macos.txt

  # Signs the three builds' archives and hashes.txt, then publishes them as a
  # draft release. It runs in the `release` environment, which holds
  # RELEASE_GPG_KEY and GPG_PASSPHRASE, takes only tags, and waits for the
  # owner's approval (RELEASE.md). Until that environment is made, GitHub makes
  # an empty one at the first run, and the job takes the repository's secrets,
  # unguarded, as the builds did. Each secret reaches its step through env:,
  # never written into a script; gpg takes the key on stdin and the passphrase
  # on a file descriptor, never on its command line. No third-party action
  # runs here: GitHub's own CLI, on the runner already, publishes the release
  # (chunk 51, docs#5).
  sign-and-publish:
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
      - build-mac
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v8
        with:
          name: seedelf-cli-linux
          path: .

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v8
        with:
          name: seedelf-cli-windows
          path: .

      - name: Download MacOS Artifacts
        uses: actions/download-artifact@v8
        with:
          name: seedelf-cli-macos
          path: .

      - name: Combine Hashes into All-Hashes
        run: cat hashes-linux.txt hashes-windows.txt hashes-macos.txt > hashes.txt

      - name: Import GPG Key
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
        run: |
          if [ -z "$RELEASE_GPG_KEY" ]; then
            echo "::error::RELEASE_GPG_KEY is empty: the release environment, or the repository, has no such secret"
            exit 1
          fi
          printf '%s\n' "$RELEASE_GPG_KEY" | gpg --batch --yes --import

      # gpg's agent keeps the unlocked key for ten minutes: stopped once the
      # files are signed, nothing after this step signs without the passphrase.
      - name: Sign the Archives and the Hashes
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          for file in seedelf-platform/seedelf-cli-linux.tar.gz seedelf-platform/seedelf-cli-windows.zip \
              seedelf-platform/seedelf-cli-macos.tar.gz hashes.txt; do
            printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                --armor --detach-sign -o "$file.asc" "$file"
          done
          gpgconf --kill gpg-agent

      # A draft, its notes these lines and then GitHub's own. The job checks
      # nothing out, so gh is told the repository. Each run makes a draft of
      # its own (RELEASE.md).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "### New Release: $GITHUB_REF_NAME" "" \
              "This release includes binaries and checksums for Linux, Windows, and macOS." "" \
              "Get the [release key here](https://github.com/logical-mechanism/Seedelf-Wallet/blob/main/util/pubkeys/seedelfwallet.asc)." "" \
              'Thank you for using `seedelf-cli`.' "" \
              "If you encounter any issues, please report them [here](https://github.com/logical-mechanism/Seedelf-Wallet/issues)." \
            | gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
                --title "$GITHUB_REF_NAME" --generate-notes --notes-file - \
                seedelf-platform/seedelf-cli-linux.tar.gz seedelf-platform/seedelf-cli-linux.tar.gz.asc \
                seedelf-platform/seedelf-cli-windows.zip seedelf-platform/seedelf-cli-windows.zip.asc \
                seedelf-platform/seedelf-cli-macos.tar.gz seedelf-platform/seedelf-cli-macos.tar.gz.asc \
                hashes.txt hashes.txt.asc
