[workspace]
resolver = "3"
members = [
    "seedelf-cli",
    "seedelf-core",
    "seedelf-crypto",
    "seedelf-display",
    "seedelf-koios",
    "seedelf-web-wallet/wasm",
]


[workspace.dependencies]
seedelf-core = "0.5.0"
seedelf-crypto = "0.5.0"
seedelf-display = "0.5.0"
seedelf-koios = "0.5.0"


[patch.crates-io]
seedelf-core = { path = "seedelf-core" }
seedelf-crypto = { path = "seedelf-crypto" }
seedelf-display = { path = "seedelf-display" }
seedelf-koios  = { path = "seedelf-koios" }


[workspace.package]
version = "0.5.0"


# The web wallet's WebAssembly module, built for size by
# seedelf-web-wallet/wasm/build.sh. The CLI keeps the plain release profile.
# Against release it cuts the module by almost two-thirds (7.1 MB to 2.6 MB,
# 1,474 KB to 797 KB gzipped, 2026-10-04) at the same speed: the BLS
# arithmetic is blst's C either way.
# wasm-opt was tried on top and left out: smaller raw, larger compressed.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# Core, crypto and koios check integer overflow in the module, as every test
# build does: a sum past what its type holds panics, a trap that locks the
# wallet (background/wasm.ts), rather than wrapping to a small, false figure
# (1.6.0's release review, x-release#7; 314-core#1 was such a sum). +7 KB raw,
# +4 KB gzipped. Not seedelf-wasm, the module's own crate: there the checks
# double the module (3.2 MB to 6.4 MB, 982 KB to 1,289 KB gzipped). The
# dependencies keep release's arithmetic.
#
# A check goes with the crate that compiles the code, not the one that defines
# it (1.7.0's release review, pr332#0): a small core function with no call in
# it, or a generic one instantiated with seedelf-wasm's types, compiles into
# seedelf-wasm and wraps there, and a seedelf-wasm sum over a type core also
# sums can link core's checked copy and trap. So no crate leans on the checks:
# a value from outside the wallet is summed with checked_* and refused in
# words. seedelf-core/tests/wasm_profile_test.rs fails without these sections.
[profile.wasm-release.package.seedelf-core]
overflow-checks = true

[profile.wasm-release.package.seedelf-crypto]
overflow-checks = true

[profile.wasm-release.package.seedelf-koios]
overflow-checks = true
