[workspace]
resolver = "3"
members = [
    "seedelf-cli",
    "seedelf-core",
    "seedelf-crypto",
    "seedelf-display",
    "seedelf-koios",
    "seedelf-web-wallet/wasm",
]


[workspace.dependencies]
seedelf-core = "0.4.10"
seedelf-crypto = "0.4.10"
seedelf-display = "0.4.10"
seedelf-koios = "0.4.10"


[patch.crates-io]
seedelf-core = { path = "seedelf-core" }
seedelf-crypto = { path = "seedelf-crypto" }
seedelf-display = { path = "seedelf-display" }
seedelf-koios  = { path = "seedelf-koios" }


[workspace.package]
version = "0.4.10"


# The web wallet's WebAssembly module, built for size by
# seedelf-web-wallet/wasm/build.sh. The CLI keeps the plain release profile.
# Against release it halves the module (2.3 MB to 1.2 MB, 582 KB to 424 KB
# gzipped) at the same speed: the BLS arithmetic is blst's C either way.
# wasm-opt was tried on top and left out: smaller raw, larger compressed.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
