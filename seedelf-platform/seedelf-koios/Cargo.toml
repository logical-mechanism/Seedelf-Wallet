[package]
name = "seedelf-koios"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Koios Packages For Seedelf: A Cardano Stealth Wallet"
authors = ["Logical Mechanism LLC <support@logicalmechanism.io>"]
repository = "https://github.com/logical-mechanism/Seedelf-Wallet"

[dependencies]
anyhow = "1.0.98"
hex = "0.4.3"
# Reading a register from a datum's CBOR; on the workspace's Pallas.
pallas-codec = "0.35.0"
reqwest = { version = "0.12.9", features = ["json"] }
serde = { version = "1.0.215", features = ["derive"] }
# raw_value: a datum's JSON is taken raw, so its depth can't fail a response.
serde_json = { version = "1.0.133", features = ["raw_value"] }
# seedelf stuff
seedelf-crypto = { workspace = true }