[package]
name = "seedelf-core"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Core Packages For Seedelf: A Cardano Stealth Wallet"
authors = ["Logical Mechanism LLC <support@logicalmechanism.io>"]
repository = "https://github.com/logical-mechanism/Seedelf-Wallet"

[dependencies]
anyhow = "1.0.98"
bech32 = "0.9.1"
blstrs = "0.7.1"
hex = "0.4.3"
hex-literal = "1.0.0"
pallas-addresses = "0.35.0"
pallas-codec = "0.35.0"
pallas-crypto = "0.35.0"
pallas-primitives = "0.35.0"
pallas-traverse = "0.35.0"
pallas-txbuilder = "0.35.0"
pallas-wallet = "0.35.0"
rand_core = { version = "0.6.0", features = ["std"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
# seedelf stuff
seedelf-crypto = { workspace = true }
seedelf-koios = { workspace = true }

[dev-dependencies]
tokio = { version = "1.41.1", features = ["macros", "rt"] }
proptest = "1"
