[package]
name = "seedelf-wasm"
version.workspace = true
edition = "2024"
license = "MIT"
description = "WebAssembly bindings for the Seedelf web wallet"
authors = ["Logical Mechanism LLC <support@logicalmechanism.io>"]
repository = "https://github.com/logical-mechanism/Seedelf-Wallet"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.98"
blstrs = "0.7.1"
cryptoxide = "0.5.0"
ff = "0.13.0"
hex = "0.4.3"
pallas-crypto = "0.33.0"
pallas-txbuilder = "0.33.0"
pallas-wallet = "0.33.0"
rand_core = { version = "0.6.0", features = ["std"] }
seedelf-core = { workspace = true }
seedelf-crypto = { workspace = true }
seedelf-koios = { workspace = true }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
wasm-bindgen = "0.2"

[dev-dependencies]
pallas-primitives = "0.33.0"
pallas-traverse = "0.33.0"

# Only here to switch on getrandom's browser backend (crypto.getRandomValues)
# for wasm32-unknown-unknown; seedelf-crypto and seedelf-core draw their
# randomness through it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
