<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Home on its own time</title>
<link rel="stylesheet" href="../../../shared.css" />
<link rel="stylesheet" href="pool.css" />
<style>
  .thepool { left: 72px; top: 330px; width: 330px; height: 400px; }
  .home { left: 1188px; top: 466px; width: 340px; }
  .when { position: absolute; width: 140px; text-align: center; font-size: 22px; font-weight: 700; color: var(--amber); }
  .tick { position: absolute; top: 734px; width: 80px; text-align: center; font-size: 22px; font-weight: 600; color: var(--muted); }
  .points { position: absolute; left: 72px; right: 72px; top: 808px; grid-template-columns: auto auto auto; justify-content: start; column-gap: 56px; }
</style>
</head>
<body>
  <header>
    <p class="kicker">3 · Back</p>
    <h1>Home on its own time</h1>
    <p class="sub">Each box comes back alone, hours apart, under a fresh disguise</p>
  </header>
  <img class="wordmark" src="../../../../extension/public/brand/wordmark-on-dark.png" alt="" />

  <div class="pool thepool" id="pool">
    <div class="head">
      <h2>Lovejoin</h2>
    </div>
  </div>

  <svg class="flow" viewBox="0 0 1600 900" aria-hidden="true">
    <defs>
      <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerUnits="userSpaceOnUse"
              markerWidth="22" markerHeight="22" orient="auto-start-reverse">
        <path d="M1,1 L9,5 L1,9" style="fill:none; stroke:#00c4bc; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round" />
      </marker>
    </defs>
    <!-- The clock: 0 h at x 470, 6 h at x 1070, 100 px an hour. -->
    <path d="M 470 712 L 1070 712" stroke="rgb(255 255 255 / 0.25)" stroke-width="3" />
    <g stroke="rgb(255 255 255 / 0.25)" stroke-width="3">
      <path d="M 470 704 V 720" /><path d="M 670 704 V 720" /><path d="M 870 704 V 720" /><path d="M 1070 704 V 720" />
    </g>

    <!-- Each box waits in the pool (dotted), then goes home on its own (solid). -->
    <g fill="none" stroke-width="4" stroke-linecap="round">
      <path d="M 410 430 L 568 430" stroke="rgb(245 178 0 / 0.5)" stroke-dasharray="2 12" />
      <path d="M 410 540 L 760 540" stroke="rgb(245 178 0 / 0.5)" stroke-dasharray="2 12" />
      <path d="M 410 650 L 994 650" stroke="rgb(245 178 0 / 0.5)" stroke-dasharray="2 12" />
    </g>
    <path class="line" d="M 642 430 C 940 430, 1060 506, 1176 506" marker-end="url(#head)" />
    <path class="line" d="M 834 540 C 980 540, 1060 546, 1176 546" marker-end="url(#head)" />
    <path class="line" d="M 1068 650 C 1120 650, 1130 586, 1176 586" marker-end="url(#head)" />
  </svg>

  <p class="tick" style="left: 430px">0 h</p>
  <p class="tick" style="left: 630px">2 h</p>
  <p class="tick" style="left: 830px">4 h</p>
  <p class="tick" style="left: 1030px">6 h</p>

  <div class="b mixed" style="left: 570px; top: 409px"></div>
  <div class="b mixed" style="left: 762px; top: 519px"></div>
  <div class="b mixed" style="left: 996px; top: 629px"></div>
  <p class="when" style="left: 536px; top: 370px">1 h 18 m</p>
  <p class="when" style="left: 728px; top: 480px">3 h 06 m</p>
  <p class="when" style="left: 962px; top: 590px">5 h 36 m</p>

  <div class="card private home">
    <div class="icon"><img src="../../../../extension/public/brand/emblem.png" alt="" /></div>
    <div><h2>Private balance</h2><p>Under a fresh disguise</p></div>
  </div>

  <ul class="points">
    <li>
      <svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="rgb(0 196 188 / 0.18)" /><path d="M9 15.5 L13.5 20 L21.5 11" fill="none" stroke="#00c4bc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg>
      <span>At its own random time</span>
    </li>
    <li>
      <svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="rgb(0 196 188 / 0.18)" /><path d="M9 15.5 L13.5 20 L21.5 11" fill="none" stroke="#00c4bc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg>
      <span>Pays its own way home</span>
    </li>
    <li>
      <svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="rgb(0 196 188 / 0.18)" /><path d="M9 15.5 L13.5 20 L21.5 11" fill="none" stroke="#00c4bc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg>
      <span>Nothing on the way back names your account</span>
    </li>
  </ul>

  <script>
    {
      // The pool: three across, five down, all alike.
      const pool = document.getElementById("pool");
      const cols = 3, rows = 5, w = 72, h = 42, gx = 26, gy = 20;
      const x0 = (330 - (cols * w + (cols - 1) * gx)) / 2, y0 = 92;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const b = document.createElement("div");
          b.className = "b mixed";
          b.style.left = `${x0 + c * (w + gx)}px`;
          b.style.top = `${y0 + r * (h + gy)}px`;
          pool.append(b);
        }
      }
    }
  </script>
</body>
</html>
