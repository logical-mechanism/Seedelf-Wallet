[package]
name = "seedelf-data-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Seedelf Wallet's data layer: the private index, and the API in front of a home db-sync"

[dependencies]
anyhow = "1.0.98"
axum = "0.8"
# CIP-5 and CIP-129 IDs: db-sync holds bytes, and pg_cardano, which Koios encodes them with, isn't installed.
bech32 = "0.11"
# The relay's copy of seedelf-messaging's point check (src/messaging/check.rs): the same G1 library the crate uses,
# blst's audited C and assembly behind a safe API; group for its traits. portable: without it blst builds for the
# builder's CPU, ADX code alone on a builder that has ADX, which a server without ADX can't run. Portable, it holds
# both and picks once at start: on an ADX CPU the same code, after a test and a branch at each field multiplication.
blstrs = { version = "0.7.1", features = ["portable"] }
# blake2b-224: Lovejoin's script hashes, for the token pools' checks (src/lovejoin/). The crate Pallas hashes with.
cryptoxide = { version = "0.4", default-features = false, features = ["blake2"] }
deadpool-postgres = "0.14"
dotenvy = "0.15"
group = "0.13"
# The edge's answer body (src/edge.rs, `Sent`): it counts and paces every answer as it's handed to the connection.
http-body = "1"
http-body-util = "0.1"
percent-encoding = "2.3"
# Plain HTTP to the home submit-api and Ogmios (LAN now, WireGuard later): no TLS.
reqwest = { version = "0.12.9", default-features = false }
serde = { version = "1.0.215", features = ["derive"] }
# raw_value: transaction metadata passes through as written, however deep it nests.
serde_json = { version = "1.0.133", features = ["raw_value"] }
# The relay's proof of work (src/messaging/check.rs): SHA-256, as seedelf-messaging computes it.
sha2 = "0.10.9"
# TCP_USER_TIMEOUT on the API's listener (src/serve.rs): tokio's own socket has no setter for it. The version and
# features tokio already builds, so nothing new is compiled.
socket2 = { version = "0.6", features = ["all"] }
# net: the API's own listener, its socket options set before it listens (src/serve.rs).
tokio = { version = "1.52", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# The home Postgres is reached over the LAN now and over WireGuard later: no TLS of its own.
tokio-postgres = "0.7"
# gzip alone: a brotli encoder in flight holds about 2.6 MB, gzip's about 0.7 MB (the 1.10.0 gate's FI-6).
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "set-header"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# test-util: a test's clock can be paused, to check a deadline without waiting it out.
# io-util and net: a test's own socket, to send a request that stops half way (tests/requests_end.rs).
tokio = { version = "1.52", features = ["io-util", "net", "test-util"] }
tower = { version = "0.5", features = ["util"] }
