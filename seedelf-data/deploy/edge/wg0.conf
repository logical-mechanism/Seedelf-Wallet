# /etc/wireguard/wg0.conf on the VPS: the tunnel's end that home dials. The
# VPS reaches home's services at 10.88.0.2, and home's node and db-sync reach
# the internet through here (nftables.conf masquerades them).

[Interface]
PrivateKey = <the VPS's private key: wg genkey, never committed>
Address = 10.88.0.1/24
ListenPort = 51820
MTU = 1420

[Peer]
PublicKey = <home's public key>
AllowedIPs = 10.88.0.2/32
