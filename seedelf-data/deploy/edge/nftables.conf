#!/usr/sbin/nft -f
# /etc/nftables.conf on the VPS, a machine that does nothing else: this
# replaces every rule on it. In: SSH, HTTPS, WireGuard. Through: home's
# tunnelled traffic out to the internet, and only replies back in.

flush ruleset

table inet seedelf_vps {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    meta l4proto { icmp, ipv6-icmp } accept
    # SSH: narrow it to your own address if you have a fixed one.
    tcp dport 22 accept
    tcp dport { 80, 443 } accept
    # HTTP/3.
    udp dport 443 accept
    udp dport 51820 accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    ct state established,related accept
    # Home's node and db-sync, out through the VPS. Nothing starts inward.
    iifname "wg0" ip saddr 10.88.0.2 oifname != "wg0" accept
  }
}

table ip seedelf_nat {
  chain postrouting {
    type nat hook postrouting priority srcnat;
    ip saddr 10.88.0.0/24 oifname != "wg0" masquerade
  }
}
