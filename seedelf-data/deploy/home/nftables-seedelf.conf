# /etc/nftables.d/seedelf.conf on the home server (include it from
# /etc/nftables.conf). It filters wg0 alone: the LAN and the box's other
# services keep whatever rules they have today.
#
# Through the tunnel, the VPS reaches Postgres, the Seedelf Kupo, Ogmios and
# submit-api, and nothing else does. Replies to the node's and db-sync's own
# connections out through the tunnel come back in.

table inet seedelf_home {
  chain input {
    type filter hook input priority filter; policy accept;
    iifname "wg0" ct state established,related accept
    iifname "wg0" ip saddr 10.88.0.1 tcp dport { 5432, 1443, 1337, 8090 } accept
    iifname "wg0" drop
  }
  chain forward {
    type filter hook forward priority filter; policy accept;
    iifname "wg0" drop
    oifname "wg0" drop
  }
}
