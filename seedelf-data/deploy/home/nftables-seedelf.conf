# /etc/nftables.d/seedelf.conf on the home server, loaded by
# seedelf-nftables.service. It filters wg0 alone: the LAN and the box's
# other services keep whatever rules they have today (ufw's, and Docker's
# where it runs).
#
# Through the tunnel, the VPS reaches Postgres, the Seedelf Kupo, Ogmios and
# submit-api, and nothing else does; nothing passes through the box to or
# from wg0. A packet must pass every table's input chain, so ufw must allow
# these four ports on wg0 too.

# Replaced whole, in one step, so loading it again never doubles a rule.
table inet seedelf_home
delete table inet seedelf_home

table inet seedelf_home {
  chain input {
    type filter hook input priority filter; policy accept;
    iifname "wg0" ct state established,related accept
    iifname "wg0" ip saddr 10.88.0.1 tcp dport { 5432, 1443, 1337, 8090 } accept
    iifname "wg0" drop
  }
  chain forward {
    type filter hook forward priority filter; policy accept;
    iifname "wg0" drop
    oifname "wg0" drop
  }
}
