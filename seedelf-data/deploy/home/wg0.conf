# /etc/wireguard/wg0.conf on the home server: the tunnel home dials out to
# the VPS, so home opens no port and its IP is known only to the VPS and its
# provider. Enable with `systemctl enable --now wg-quick@wg0`.
#
# Table = off: wg-quick adds no route for AllowedIPs, so nothing on the box
# moves into the tunnel by itself. Only the node's and db-sync's traffic
# does, by seedelf-tunnel-routes.service's rules, once they're synced: the
# box runs another project too. Those rules live apart from wg-quick, so a
# restart of the tunnel never lets that traffic out another way.

[Interface]
PrivateKey = <home's private key: wg genkey, never committed>
Address = 10.88.0.2/24
Table = off
MTU = 1420
# The tunnel's route for the node and db-sync (table 51820). Without wg0,
# that table holds only an unreachable route: they reach nothing. No
# PostDown: the kernel drops the route with wg0, and deleting it again
# would fail and leave the unit failed.
PostUp = ip route replace default dev wg0 table 51820

[Peer]
PublicKey = <the VPS's public key>
Endpoint = <the VPS's public IP>:51820
AllowedIPs = 0.0.0.0/0
# Home is behind NAT: keep the mapping open so the VPS can always reach it.
PersistentKeepalive = 25
