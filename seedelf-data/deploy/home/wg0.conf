# /etc/wireguard/wg0.conf on the home server: the tunnel home dials out to
# the VPS, so home opens no port for it. Enable with
# `systemctl enable --now wg-quick@wg0`, which requires seedelf-nftables.
#
# It carries the API's calls to home and nothing else. The node is a stake
# pool's relay and keeps the home IP (deploy/README.md, section 3), so the
# tunnel takes only the VPS's address: WireGuard itself refuses any packet
# from another, and no route but the VPS's moves into it.

[Interface]
PrivateKey = <home's private key: wg genkey, never committed>
Address = 10.88.0.2/24
MTU = 1420

[Peer]
PublicKey = <the VPS's public key>
Endpoint = <the VPS's public IP>:51820
AllowedIPs = 10.88.0.1/32
# Home is behind NAT: keep the mapping open so the VPS can always reach it.
PersistentKeepalive = 25
