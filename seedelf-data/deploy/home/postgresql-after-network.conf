# /etc/systemd/system/postgresql@.service.d/after-network.conf
#
# Postgres binds listen_addresses once, at start. Started before the LAN
# address (found 2026-10-09) or wg0 is up, it listens on localhost alone and
# only warns. wg-quick creates wg0's address whether or not the VPS answers.
[Unit]
Wants=network-online.target
After=network-online.target wg-quick@wg0.service
