# Settings for the API, in postgresql.conf or a file it includes
# (conf.d/seedelf.conf). Restart Postgres after changing listen_addresses.

# The tunnel's address too, so the VPS can reach Postgres. Keep whatever
# else is listed today: other things on the LAN may use this database.
listen_addresses = 'localhost, <home wg0 address>'

# Nothing of a query reaches the disk: no statements, none on error, and
# no parameter values (Postgres's default, kept explicit).
log_statement = 'none'
log_min_error_statement = 'panic'
log_parameter_max_length_on_error = 0
log_min_duration_statement = -1
