# /etc/nftables.d/seedelf-egress.conf on the home server: deploy/README.md's
# step 3 only. Loaded before then, it cuts the node off from its peers.
#
# The kill switch, apart from routing and from wg-quick: the node's and
# db-sync's packets leave through wg0, to loopback, or to the IPv4 LAN, and
# nowhere else, IPv6 included. Whatever runs as the node's user (Kupo, and
# Ogmios and submit-api if they do) is held to the same: add any other local
# network that reaches them (a container bridge) to the LAN set.

table inet seedelf_egress {
  set lan {
    type ipv4_addr; flags interval;
    elements = { <LAN prefix> }
  }
  chain output {
    type filter hook output priority filter; policy accept;
    meta skuid { <node user>, <db-sync user> } oifname { "lo", "wg0" } accept
    meta skuid { <node user>, <db-sync user> } ip daddr @lan accept
    meta skuid { <node user>, <db-sync user> } drop
  }
}
